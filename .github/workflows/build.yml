name: Build

on:
  push:
    branches: [main]
    # Don't rebuild for docs/manifest-only changes — keeps direct release
    # URLs in altstore-source.json from going stale on every commit.
    paths-ignore:
      - "altstore-source.json"
      - "**/*.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on push to main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Run unit tests on simulator
        run: |
          xcodebuild test \
            -project PhotoSwiper.xcodeproj \
            -scheme PhotoSwiper \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project PhotoSwiper.xcodeproj \
            -scheme PhotoSwiper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Ad-hoc sign the .app post-build
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/PhotoSwiper.app
          ls -lh "$APP"
          codesign --force --sign - --timestamp=none --deep "$APP"
          echo "--- codesign verification ---"
          codesign -dv "$APP" 2>&1 || true
          codesign --verify --verbose=2 "$APP"

      - name: Package signed IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/PhotoSwiper.app build/Payload/
          (cd build && zip -qr PhotoSwiper.ipa Payload)
          ls -lh build/PhotoSwiper.ipa
          echo "--- IPA contents ---"
          unzip -l build/PhotoSwiper.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSwiper-ipa
          path: build/PhotoSwiper.ipa
          retention-days: 30

      - name: Compute release tag
        id: tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="v0.1.$(date +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: build/PhotoSwiper.ipa
          generate_release_notes: true
